<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
  <title>Ahorcado</title>
</head>
<body>
  <main>
    <section >
      <span class="the-hangman">
        <svg id="drawing" viewbox="0 0 200 200">
          <line x1="10" y1="190" x2="190" y2="190" stroke="black" stroke-width="5"/>
          <line x1="30" y1="10" x2="30" y2="190" stroke="black" stroke-width="5"/>
          <line x1="30" y1="12.5" x2="100" y2="12.5" stroke="black" stroke-width="5"/>
          <line x1="100" y1="10" x2="100" y2="30" stroke="black" stroke-width="5"/>
          <circle id="head" cx="100" cy="50" r="20" fill="black"/>
          <line id="body" x1="100" y1="70" x2="100" y2="130" stroke="black" stroke-width="3"/>
          <line id="left-arm" x1="100" y1="70" x2="75" y2="100" stroke="black" stroke-width="3"/>
          <line id="right-arm" x1="100" y1="70" x2="125" y2="100" stroke="black" stroke-width="3"/>
          <line id="left-leg" x1="100" y1="130" x2="75" y2="160" stroke="black" stroke-width="3"/>
          <line id="right-leg" x1="100" y1="130" x2="125" y2="160" stroke="black" stroke-width="3"/>
        </svg>
      </span>
      <span class="the-word">

      </span>
    </section>
    <section class="button-panel">
      <h3 id="panel-label">Presiona un botón</h3>
      <span class="letter-buttons">

      </span>
    </section>
    <section class="menu">
      <button id="multiplayer-button">Multijugador</button>
      <button id="singleplayer-button">Un Jugador</button>
    </section>
  </main>
</body>
</html>
